[workspace]
resolver = "3"
members = ["crates/brd14", "crates/brd14-conform", "crates/brd14-ffi", "crates/brd14-wasm"]
# The cargo-fuzz project has its own manifest and lockfile (it needs libfuzzer-sys and a
# nightly toolchain); it is never part of a workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jonny-novikov/brd14"
rust-version = "1.85"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
